name: recipe-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_manager
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recipe_pg_data:/var/lib/postgresql/data

volumes:
  recipe_pg_data:
